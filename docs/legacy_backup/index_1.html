<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Personal AI Memory</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0d1220;color:#edf1fa;min-height:100vh;padding:32px 20px}
.app{max-width:1150px;margin:auto}
header{text-align:center;margin:25px 0 35px}
h1{font-size:36px;letter-spacing:-1px;margin-bottom:10px}
header p{color:#aab5cb;font-size:16px}
.panel,.answer-card{background:#171f30;border:1px solid #303c53;border-radius:16px;padding:24px}
label{display:block;font-weight:600;margin-bottom:10px}
select,textarea{width:100%;background:#0e1524;color:#f4f6ff;border:1px solid #43516e;border-radius:10px;padding:13px;font:inherit}
select{margin-bottom:20px;cursor:pointer}
textarea{min-height:120px;resize:vertical}
button{background:#7165f5;color:white;border:0;border-radius:9px;padding:13px 20px;font-size:15px;font-weight:650;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#askButton{margin-top:15px}
#status{color:#b7c2d8;line-height:1.5}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px;align-items:start}
.answer-card{min-width:0;overflow:hidden}
.answer-card h2{font-size:20px;margin:0 0 20px;display:flex;align-items:center;gap:10px}
.ai-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.gemini-dot{background:#65a9ff}
.groq-dot{background:#ff9a58}
.answer{line-height:1.75;font-size:15px;overflow-wrap:anywhere}
.answer h1,.answer h2,.answer h3{line-height:1.35;margin:24px 0 12px;color:#f4f6ff}
.answer h1{font-size:24px}
.answer h2{font-size:20px}
.answer h3{font-size:17px}
.answer p{margin:12px 0}
.answer ul,.answer ol{padding-left:25px}
.answer li{margin:6px 0}
.answer strong{color:#fff}
.answer blockquote{margin:16px 0;padding:4px 15px;border-left:3px solid #7165f5;color:#c7d0e3}
.answer pre{background:#0b1020;padding:16px;border-radius:9px;overflow-x:auto;white-space:pre}
.answer code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:#0c1322;padding:2px 5px;border-radius:4px}
.answer pre code{padding:0;background:transparent}
.answer table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
.answer th,.answer td{border:1px solid #3a4660;padding:9px 11px;text-align:left}
.answer th{background:#222d43}
.answer hr{border:0;border-top:1px solid #39465f;margin:22px 0}
.answer a{color:#9baeff}
.card-error{color:#ffb7b7;white-space:pre-wrap;overflow-wrap:anywhere}
.hidden{display:none}
.prefer-button{margin-top:18px;background:#283753;border:1px solid #526485}
.prefer-button:hover{background:#394d74}
.answer-card.is-preferred{border-color:#70d3a6;box-shadow:0 0 0 1px #70d3a6}
@media(max-width:760px){body{padding:15px}header{margin:20px 0 25px}h1{font-size:29px}.panel,.answer-card{padding:17px}.answers{grid-template-columns:1fr}}
.reason-chooser{
    margin-top:20px;
    padding:16px;
    border:1px solid #3b4964;
    background:#111a2b;
    border-radius:12px
}
.reason-chooser h3{margin:0 0 10px;font-size:17px}
.reason-note{color:#aab5cb;font-size:13px;line-height:1.5}
.reason-options{display:grid;gap:12px;margin:16px 0}
.reason-option{display:flex;gap:10px;align-items:flex-start;font-weight:normal;margin:0;line-height:1.5}
.reason-option input{width:auto;margin-top:4px;accent-color:#7165f5}
.reason-chooser textarea{min-height:75px;margin-top:8px}
.reason-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.reason-actions button{margin:0}
.reason-chooser .skip-button{background:#303b52}
.conversation-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px
}
.secondary-button{
    margin:0;
    background:#303b52;
    border:1px solid #52617d
}
</style>
</head>
<body>
<div class="app">
<header>
<h1>Personal AI Memory</h1>
<p>One question. Multiple AI assistants. Your preferences.</p>
</header>

<main class="panel">
<div class="conversation-actions">
    <button type="button" id="continueButton" class="secondary-button">
        Continue last conversation
    </button>
    <button type="button" id="newConversationButton" class="secondary-button">
        New conversation
    </button>
</div>
<p id="conversationStatus" class="reason-note">
    Choose whether to continue your saved conversation or start a new one.
</p>
<label for="provider">Choose AI assistant</label>
<select id="provider">
<option value="both">Ask both — Gemini + Groq</option>
<option value="gemini">Gemini only</option>
<option value="groq">Groq only</option>
</select>

<label for="message">Your question</label>
<textarea id="message" placeholder="Ask anything..."></textarea>
<button id="askButton">Ask both AIs</button>
<p id="status" role="status"></p>
</main>

<section id="results" class="answers hidden" aria-live="polite"></section>
</div>

<script>
const provider=document.getElementById("provider");
const message=document.getElementById("message");
const button=document.getElementById("askButton");
const status=document.getElementById("status");
const results=document.getElementById("results");
let conversationId=null;

const continueButton=document.getElementById("continueButton");
const newConversationButton=document.getElementById("newConversationButton");
const conversationStatus=document.getElementById("conversationStatus");

continueButton.addEventListener("click",async()=>{
    continueButton.disabled=true;
    conversationStatus.textContent="Loading your last saved conversation...";

    try{
        const response=await fetch("/conversations/continue-latest",{
            method:"POST"
        });
        const data=await response.json();

        if(!response.ok){
            throw new Error(data.detail||"Could not load conversation.");
        }

        conversationId=data.conversation_id;

        if(data.has_history){
            conversationStatus.textContent=
                `Continuing from your saved ${data.preferred_provider} response. Previous question: ${data.seed_question}`;
            status.textContent="Your next question will use this conversation's history.";
        }else{
            conversationStatus.textContent=data.message;
        }

        results.replaceChildren();
        results.classList.add("hidden");
    }catch(error){
        conversationStatus.textContent="Error: "+error.message;
    }finally{
        continueButton.disabled=false;
    }
});

newConversationButton.addEventListener("click",async()=>{
    try{
        const response=await fetch("/conversations/new",{
            method:"POST"
        });
        const data=await response.json();

        if(!response.ok){
            throw new Error(data.detail||"Could not start a new conversation.");
        }

        conversationId=data.conversation_id;
        conversationStatus.textContent="New conversation started. Previous turns won't be included.";
        status.textContent="";
        results.replaceChildren();
        results.classList.add("hidden");
        message.value="";
    }catch(error){
        conversationStatus.textContent="Error: "+error.message;
    }
});

function updateButton(){
    const names={
        both:"Ask both AIs",
        gemini:"Ask Gemini",
        groq:"Ask Groq"
    };
    button.textContent=names[provider.value];
}

provider.addEventListener("change",updateButton);

function renderAnswer(text,element){
    if(window.marked&&window.DOMPurify){
        element.innerHTML=DOMPurify.sanitize(marked.parse(text));
    }else{
        element.textContent=text;
    }
}

function showReasonChooser(card,requestId,suggestions,source){
    document.querySelectorAll(".reason-chooser").forEach(el=>el.remove());

    const box=document.createElement("div");
    box.className="reason-chooser";

    const title=document.createElement("h3");
    title.textContent="What stood out in this answer?";
    box.appendChild(title);

    const note=document.createElement("p");
    note.className="reason-note";
    note.textContent=source==="gemini"
        ?"Gemini suggested these possibilities using the answers and previous preference history. They're guesses—select only what fits."
        :"Choose any reasons that fit. These are general suggestions because personalized suggestions were unavailable.";
    box.appendChild(note);

    const options=document.createElement("div");
    options.className="reason-options";

    suggestions.forEach(reason=>{
        const label=document.createElement("label");
        label.className="reason-option";

        const checkbox=document.createElement("input");
        checkbox.type="checkbox";
        checkbox.value=reason;

        const text=document.createElement("span");
        text.textContent=reason;

        label.append(checkbox,text);
        options.appendChild(label);
    });

    box.appendChild(options);

    const otherLabel=document.createElement("label");
    otherLabel.textContent="Other (optional)";

    const otherInput=document.createElement("textarea");
    otherInput.placeholder="Write your own reason if the options don't describe it...";
    otherInput.maxLength=500;
    otherInput.rows=2;

    otherLabel.appendChild(otherInput);
    box.appendChild(otherLabel);

    const feedbackStatus=document.createElement("p");
    feedbackStatus.className="reason-note";
    box.appendChild(feedbackStatus);

    const actions=document.createElement("div");
    actions.className="reason-actions";

    const saveButton=document.createElement("button");
    saveButton.textContent="Save feedback";

    const skipButton=document.createElement("button");
    skipButton.textContent="Skip for now";
    skipButton.className="skip-button";

    actions.append(saveButton,skipButton);
    box.appendChild(actions);
    card.appendChild(box);

    skipButton.addEventListener("click",()=>{
        box.remove();
        feedbackStatus.textContent="";
        status.textContent="Your response choice is saved. No extra feedback added.";
    });

    saveButton.addEventListener("click",async()=>{
        const reasons=[...options.querySelectorAll("input:checked")]
            .map(input=>input.value);

        const custom_reason=otherInput.value.trim();

        if(!reasons.length&&!custom_reason){
            feedbackStatus.textContent="Select a reason or write something under Other. You can also skip.";
            return;
        }

        saveButton.disabled=true;
        skipButton.disabled=true;
        feedbackStatus.textContent="Saving your preferences...";

        try{
            const response=await fetch("/preference-feedback",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    request_id:requestId,
                    reasons:reasons,
                    custom_reason:custom_reason
                })
            });

            const data=await response.json();

            if(!response.ok){
                throw new Error(data.detail||"Could not save feedback.");
            }

            box.replaceChildren();

            const saved=document.createElement("p");
            saved.className="reason-note";
            saved.textContent="✓ Feedback saved. Future responses will use these preferences when relevant.";
            box.appendChild(saved);

            status.textContent="Preference saved and feedback recorded.";
        }catch(error){
            feedbackStatus.textContent="Could not save: "+error.message;
            saveButton.disabled=false;
            skipButton.disabled=false;
        }
    });
}

function addCard(providerKey,name,text,error,requestId){
    const card=document.createElement("article");
    card.className="answer-card";

    const heading=document.createElement("h2");
    const dot=document.createElement("span");
    dot.className="ai-dot "+(name==="Gemini"?"gemini-dot":"groq-dot");
    heading.append(dot,document.createTextNode(name));
    card.appendChild(heading);

    const body=document.createElement("div");
    body.className=error?"card-error":"answer";

    if(error){
        body.textContent="This assistant could not respond.\n"+error;
    }else{
        renderAnswer(text,body);
    }

    card.appendChild(body);

    if(!error){
        const preferButton=document.createElement("button");
        preferButton.className="prefer-button";
        preferButton.textContent="Prefer this response";

        preferButton.addEventListener("click",async()=>{
            const buttons=[...results.querySelectorAll(".prefer-button")];
            buttons.forEach(b=>b.disabled=true);
            status.textContent="Saving your choice and generating possible reasons...";

            try{
                const response=await fetch("/preference",{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({
                        request_id:requestId,
                        provider:providerKey
                    })
                });

                const data=await response.json();

                if(!response.ok){
                    throw new Error(data.detail||"Could not save preference.");
                    conversationId=data.conversation_id||conversationId;
                }

                results.querySelectorAll(".reason-chooser").forEach(el=>el.remove());

                results.querySelectorAll(".answer-card").forEach(c=>{
                    c.classList.remove("is-preferred");
                    const b=c.querySelector(".prefer-button");

                    if(b){
                        b.textContent="Prefer this response";
                        b.disabled=false;
                    }
                });

                card.classList.add("is-preferred");
                preferButton.textContent="✓ Preferred response saved";

                showReasonChooser(
                    card,
                    requestId,
                    data.reason_suggestions||[],
                    data.suggestion_source||"fallback"
                );

                status.textContent="Your choice is saved. Confirm any reasons that fit, or skip.";
            }catch(error){
                status.textContent="Could not save preference: "+error.message;
                buttons.forEach(b=>b.disabled=false);
            }
        });

        card.appendChild(preferButton);
    }

    results.appendChild(card);
}

button.addEventListener("click",async()=>{
    const question=message.value.trim();

    if(!question){
        status.textContent="Please enter a question first.";
        message.focus();
        return;
    }

    button.disabled=true;
    provider.disabled=true;
    status.textContent="Waiting for your selected AI assistant(s)...";
    results.replaceChildren();
    results.classList.add("hidden");

    try{
        const response=await fetch("/ask",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
               message:question,
               provider:provider.value,
               conversation_id:conversationId
               })
        });

        const data=await response.json();

        if(!response.ok){
            throw new Error(typeof data.detail==="string"?data.detail:JSON.stringify(data.detail||data));
        }
        conversationId=data.conversation_id;

        const names={gemini:"Gemini",groq:"Groq"};
const selected=provider.value==="both"?["gemini","groq"]:[provider.value];

for(const name of selected){
    if(data.responses&&data.responses[name]){
        addCard(name,names[name],data.responses[name],false,data.request_id);
    }else{
        addCard(name,names[name],"",data.errors?.[name]||"No response received.",data.request_id);
    }
}

        results.classList.remove("hidden");
        status.textContent="Done. Compare the responses below.";
    }catch(error){
        status.textContent="Request failed: "+error.message;
    }finally{
        button.disabled=false;
        provider.disabled=false;
    }
});

updateButton();
</script>
</body>
</html>
